{% extends "base.html" %}

{% block page_title %}Event Calendars{% endblock %}

{% block content %}
<div class="card mb-4">
    <h2>Department Level Events</h2>
    <div id='calendar-dept'></div>
</div>

<div class="card">
    <h2>University Level Events</h2>
    <div id='calendar-univ'></div>
</div>

<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var deptCalendarEl = document.getElementById('calendar-dept');
        var deptCalendar = new FullCalendar.Calendar(deptCalendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek'
            },
            events: '/api/events/calendar?type=Department%20Level',
            eventColor: 'var(--primary-color)',
            height: 'auto'
        });
        deptCalendar.render();

        var univCalendarEl = document.getElementById('calendar-univ');
        var univCalendar = new FullCalendar.Calendar(univCalendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek'
            },
            events: '/api/events/calendar?type=University%20Level',
            eventColor: '#c0392b', // Different color for University level
            height: 'auto'
        });
        univCalendar.render();
    });
</script>
{% endblock %}
