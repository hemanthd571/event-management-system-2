{% extends "base.html" %}

{% block auth_content %}
<div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem; background-color: var(--surface-color); border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); margin-top: 5vh;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="margin-bottom: 1rem;">
            <img src="{{ url_for('static', filename='images/gmu_logo.png') }}" alt="GM University Logo" style="height: 80px; object-fit: contain;">
        </div>
        <h1 style="color: var(--primary-color); margin: 0 0 0.5rem 0; font-size: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">GM University</h1>
        <p style="color: var(--text-secondary); margin: 0; font-weight: 500; font-size: 0.875rem;">Event Management Portal</p>
    </div>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" style="font-size: 0.875rem;">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.5px;">Secure Sign In</button>
    </form>
</div>
{% endblock %}
