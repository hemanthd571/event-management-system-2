{% extends "base.html" %}

{% block page_title %}Add New User{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('admin.create_user') }}">
        
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="role">Role</label>
            <select class="form-control" id="role" name="role" required>
                {% for role in roles %}
                <option value="{{ role }}">{{ role }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group" id="department-group">
            <label class="form-label" for="department_id">Department (Optional for top level admins)</label>
            <select class="form-control" id="department_id" name="department_id">
                <option value="">-- None --</option>
                {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="{{ url_for('admin.manage_users') }}" class="btn" style="border: 1px solid var(--border-color); color: var(--text-primary);">Cancel</a>
            <button type="submit" class="btn btn-primary">Create User</button>
        </div>

    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const roleSelect = document.getElementById('role');
        const deptGroup = document.getElementById('department-group');
        const deptSelect = document.getElementById('department_id');

        function toggleDepartment() {
            // Get selected role text
            const selectedRole = roleSelect.options[roleSelect.selectedIndex].text;
            
            // Roles that do not require a department
            const topLevelRoles = ['Admin', 'Director', 'VC', 'Pro VC'];
            
            if (topLevelRoles.includes(selectedRole)) {
                deptGroup.style.display = 'none';
                deptSelect.value = ""; // Reset value
            } else {
                deptGroup.style.display = 'block';
            }
        }

        // Run on load
        toggleDepartment();

        // Run on change
        roleSelect.addEventListener('change', toggleDepartment);
    });
</script>
{% endblock %}
