{% extends "base.html" %}

{% block page_title %}Submit New Event Proposal{% endblock %}

{% block content %}
<div class="card">
    <form method="POST" action="{{ url_for('events.create') }}" enctype="multipart/form-data">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            
            <div class="form-group">
                <label class="form-label">Event Title</label>
                <input type="text" class="form-control" name="title" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Event Type</label>
                <select class="form-control" name="event_type" required>
                    <option value="Department Level">Department Level</option>
                    <option value="University Level">University Level</option>
                </select>
            </div>

            <div class="form-group" id="department-group">
                <label class="form-label">Organizing Department</label>
                <select class="form-control" name="department_id" required>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}" {% if current_user.department_id == dept.id %}selected{% endif %}>{{ dept.name }} ({{ dept.code }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Organizer Name</label>
                <input type="text" class="form-control" name="organizer_name" value="{{ current_user.username }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Faculty Coordinator</label>
                <input type="text" class="form-control" name="faculty_coordinator" required>
            </div>

            <div class="form-group">
                <label class="form-label">Event Date</label>
                <input type="date" class="form-control" name="event_date" required>
            </div>

            <div class="form-group">
                <label class="form-label">Start Time</label>
                <input type="time" class="form-control" name="start_time" required>
            </div>

            <div class="form-group">
                <label class="form-label">End Time</label>
                <input type="time" class="form-control" name="end_time" required>
            </div>

            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Venue</label>
                <select class="form-control" name="venue_id" required>
                    <option value="" disabled selected>Select a Venue...</option>
                    {% for venue in venues %}
                    <option value="{{ venue.id }}">{{ venue.name }} (Capacity: {{ venue.capacity }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Budget (₹)</label>
                <input type="number" step="0.01" class="form-control" name="budget" required>
            </div>

            <div class="form-group">
                <label class="form-label">Funding Source</label>
                <input type="text" class="form-control" name="funding_source" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Expected Participants</label>
                <input type="number" class="form-control" name="expected_participants" required>
            </div>

            <div class="form-group">
                <label class="form-label">Chief Guest</label>
                <input type="text" class="form-control" name="chief_guest">
            </div>

            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Objectives</label>
                <textarea class="form-control" name="objectives" rows="3" required></textarea>
            </div>

            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="5" required></textarea>
            </div>
            
            <!-- File Attachments -->
            <div class="form-group">
                <label class="form-label">Attach Proposal (PDF/Image)</label>
                <input type="file" class="form-control" name="proposal_pdf" accept=".pdf, image/*">
            </div>
            
        </div>
        
        <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="{{ url_for('dashboard.index') }}" class="btn" style="border: 1px solid var(--border-color); color: var(--text-primary);">Cancel</a>
            <button type="submit" class="btn btn-primary">Submit Proposal</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const eventTypeSelect = document.querySelector('select[name="event_type"]');
        const deptGroup = document.getElementById('department-group');
        const dateInput = document.querySelector('input[name="event_date"]');
        
        function toggleDepartment() {
            if (eventTypeSelect.value === 'University Level') {
                deptGroup.style.display = 'none';
            } else {
                deptGroup.style.display = 'block';
            }
        }
        
        // Run on load
        toggleDepartment();
        
        // Run on change
        eventTypeSelect.addEventListener('change', toggleDepartment);
    });
</script>
{% endblock %}
