{% extends "base.html" %}

{% block page_title %}Submit New Event Proposal{% endblock %}

{% block content %}
<div class="card">
    {% if clash_info %}
    <div style="background-color: #fff3cd; color: #856404; padding: 1rem; border: 1px solid #ffeeba; border-radius: 4px; margin-bottom: 1rem;">
        <strong>Venue is already booked!</strong> This venue is not available on the selected date.
        <form method="POST" action="{{ url_for('events.join_waitlist') }}" style="margin-top: 10px;">
            <input type="hidden" name="venue_id" value="{{ clash_info.venue_id }}">
            <input type="hidden" name="event_date" value="{{ clash_info.event_date }}">
            <input type="hidden" name="start_time" value="{{ clash_info.start_time }}">
            <input type="hidden" name="end_time" value="{{ clash_info.end_time }}">
            <button type="submit" class="btn btn-warning">Join Waitlist for this Venue & Date</button>
        </form>
    </div>
    {% endif %}
    <form method="POST" action="{{ url_for('events.create') }}" enctype="multipart/form-data">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            
            <div class="form-group">
                <label class="form-label">Event Title</label>
                <input type="text" class="form-control" name="title" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Event Type</label>
                <select class="form-control" name="event_type" required>
                    <option value="Department Level">Department Level</option>
                    <option value="University Level">University Level</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Event Category</label>
                <select class="form-control" name="event_category" id="event_category" required>
                    <option value="Seminar/Workshop">Seminar/Workshop</option>
                    <option value="Cultural Fest">Cultural Fest</option>
                    <option value="Tech Fest">Tech Fest</option>
                    <option value="Sports">Sports</option>
                    <option value="Guest Lecture">Guest Lecture</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" class="form-control" name="other_event_category" id="other_event_category" placeholder="Please specify the event category" style="display: none; margin-top: 10px;">
            </div>

            <div class="form-group" id="department-group">
                <label class="form-label">Organizing Department</label>
                <select class="form-control" name="department_id" required>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}" {% if current_user.department_id == dept.id %}selected{% endif %}>{{ dept.name }} ({{ dept.code }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Organizer Name</label>
                <input type="text" class="form-control" name="organizer_name" value="{{ current_user.username }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Faculty Coordinator</label>
                <input type="text" class="form-control" name="faculty_coordinator" required>
            </div>

            <div class="form-group">
                <label class="form-label">Event Date</label>
                <input type="date" class="form-control" name="event_date" value="{{ request.args.get('event_date', '') }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Start Time</label>
                <input type="time" class="form-control" name="start_time" value="{{ request.args.get('start_time', '') }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">End Time</label>
                <input type="time" class="form-control" name="end_time" value="{{ request.args.get('end_time', '') }}" required>
            </div>

            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Venue</label>
                <select class="form-control" name="venue_id" required>
                    <option value="" disabled {% if not request.args.get('venue_id') %}selected{% endif %}>Select a Venue...</option>
                    {% for venue in venues %}
                    <option value="{{ venue.id }}" {% if request.args.get('venue_id')|string == venue.id|string %}selected{% endif %}>{{ venue.name }} (Capacity: {{ venue.capacity }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Budget (₹)</label>
                <input type="number" step="0.01" class="form-control" name="budget" required>
            </div>

            <div class="form-group">
                <label class="form-label">Funding Source</label>
                <input type="text" class="form-control" name="funding_source" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Expected Participants</label>
                <input type="number" class="form-control" name="expected_participants" required>
            </div>

            <div class="form-group">
                <label class="form-label">Chief Guest</label>
                <input type="text" class="form-control" name="chief_guest">
            </div>

            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Objectives</label>
                <textarea class="form-control" name="objectives" rows="3" required></textarea>
            </div>

            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="5" required></textarea>
            </div>
            
            <!-- File Attachments -->
            <div class="form-group">
                <label class="form-label">Attach Proposal (PDF/Image)</label>
                <input type="file" class="form-control" name="proposal_pdf" accept=".pdf, image/*">
            </div>
            
        </div>
        
        <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="{{ url_for('dashboard.index') }}" class="btn" style="border: 1px solid var(--border-color); color: var(--text-primary);">Cancel</a>
            <button type="submit" class="btn btn-primary">Submit Proposal</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const eventTypeSelect = document.querySelector('select[name="event_type"]');
        const deptGroup = document.getElementById('department-group');
        const dateInput = document.querySelector('input[name="event_date"]');
        
        // Event Type (University/Department) logic
        function toggleDepartment() {
            if (eventTypeSelect.value === 'University Level') {
                deptGroup.style.display = 'none';
            } else {
                deptGroup.style.display = 'block';
            }
        }
        
        // Event Category (Other) logic
        const categorySelect = document.getElementById('event_category');
        const otherCategoryInput = document.getElementById('other_event_category');
        
        function toggleOtherCategory() {
            if (categorySelect.value === 'Other') {
                otherCategoryInput.style.display = 'block';
                otherCategoryInput.required = true;
            } else {
                otherCategoryInput.style.display = 'none';
                otherCategoryInput.required = false;
            }
        }
        
        // Run on load
        toggleDepartment();
        toggleOtherCategory();
        
        // Run on change
        eventTypeSelect.addEventListener('change', toggleDepartment);
        categorySelect.addEventListener('change', toggleOtherCategory);
    });
</script>
{% endblock %}
